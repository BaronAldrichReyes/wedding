<!DOCTYPE html>
<html>
<head>
    <title>Find Your Table - Jon & Regz Silver Wedding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Import the Great Vibes font for the fancy cursive -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0d1b2a; /* Deep Navy Blue */
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .wedding-title {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem; /* Much larger for the cursive font */
            font-weight: normal;
            color: #cbd5e1; /* Elegant Silver */
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); /* Subtle drop shadow */
        }
        .wedding-subtitle {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #94a3b8; /* Muted Silver/Gray */
            margin-top: 5px;
        }
        .wedding-date {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 10px;
            font-style: italic;
        }
        .card {
            background-color: #1b263b; /* Lighter Navy Card Background */
            border: 1px solid #415a77; /* Subtle Silver-Blue Border */
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: #f8fafc;
            margin-top: 0;
            font-weight: 400;
            font-size: 1.5rem;
        }
        
        /* Search Box Styling */
        .input-wrapper {
            position: relative;
            width: 100%;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #64748b;
        }
        input[type="text"] {
            padding: 12px 35px 12px 40px; /* Space for both icons */
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #415a77;
            border-radius: 8px;
            background-color: #0d1b2a;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]::placeholder {
            color: #64748b;
        }
        input[type="text"]:focus {
            border-color: #cbd5e1;
        }
        .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            display: none; /* Hidden until typing starts */
            padding: 0 5px;
        }
        .clear-btn:hover {
            color: #cbd5e1;
        }
        .help-text {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            display: block;
        }

        /* Fancy Decorative Divider */
        .fancy-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            width: 100%;
        }
        .fancy-divider::before,
        .fancy-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #415a77;
        }
        .fancy-divider svg {
            width: 24px;
            height: 24px;
            fill: #94a3b8; /* Silver matching the text */
            margin: 0 15px;
        }

        .guest-result-box {
            background-color: #0d1b2a;
            margin-bottom: 15px;
            padding: 15px;
            border: 1px solid #415a77;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- Wedding Header -->
    <div class="header-container">
        <h1 class="wedding-title">Jon & Regz</h1>
        <div class="wedding-subtitle">Silver Wedding Anniversary</div>
        <!-- You can edit or remove this date if needed -->
    </div>

    <!-- Search Card Container -->
    <div class="card">
        <h2>Find Your Table</h2>
        
        <form onsubmit="return false;">
            <div class="input-wrapper">
                <!-- SVG Magnifying Glass -->
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/>
                </svg>
                
                <input type="text" id="searchInput" name="name" placeholder="Type first or last name..." autocomplete="off">
                
                <!-- Clear Button -->
                <button type="button" id="clearBtn" class="clear-btn">&times;</button>
            </div>
        </form>

        <!-- The New Fancy Divider -->
        <div class="fancy-divider">
            <!-- Inline SVG drawing the 4-petal diamond cross -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <polygon points="12,0 14,6 12,10 10,6" />
                <polygon points="12,14 14,18 12,24 10,18" />
                <polygon points="0,12 6,10 10,12 6,14" />
                <polygon points="14,12 18,10 24,12 18,14" />
                <circle cx="12" cy="12" r="1.5" />
            </svg>
        </div>

        <div id="resultsArea">
            {% if query %}
                {% if guests %}
                    {% for guest in guests %}
                        <div class="guest-result-box">
                            <h3 style="color: #cbd5e1; margin-bottom: 5px; margin-top: 5px;">{{ guest.first_name }} {{ guest.last_name }}</h3>
                            <p style="font-size: 18px; margin-top: 0; color: #94a3b8;">Table <strong style="color: #ffffff;">{{ guest.table_number }}</strong></p>
                        </div>
                    {% endfor %}
                {% else %}
                    <p style="color: #f87171;">Sorry, we couldn't find a seat for "{{ query }}".</p>
                {% endif %}
            {% endif %}
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsArea = document.getElementById('resultsArea');
        const clearBtn = document.getElementById('clearBtn');
        let typingTimer;                
        const waitTime = 400; 

        // Clear button functionality
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            resultsArea.innerHTML = '';
            searchInput.focus();
        });

        searchInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            const query = searchInput.value.trim();

            // Show/hide clear button
            if (query.length > 0) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
                resultsArea.innerHTML = "";
                return;
            }

            typingTimer = setTimeout(() => {
                fetch(`{% url 'find_seat' %}?name=${encodeURIComponent(query)}`, { cache: 'no-store' })
                    .then(response => response.text())
                    .then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        resultsArea.innerHTML = doc.getElementById('resultsArea').innerHTML;
                    });
            }, waitTime);
        });
    </script>
</body>
</html>
